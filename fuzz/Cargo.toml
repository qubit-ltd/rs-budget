[package]
name = "qubit-budget-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = { version = "1.0", features = ["arbitrary_precision", "float_roundtrip", "raw_value"] }
qubit-budget = { path = "..", version = "0.3", features = ["serde-json"] }

[[bin]]
name = "json_decode_differential"
path = "fuzz_targets/json_decode_differential.rs"
test = false
doc = false
bench = false

[[bin]]
name = "json_budget_invariants"
path = "fuzz_targets/json_budget_invariants.rs"
test = false
doc = false
bench = false
