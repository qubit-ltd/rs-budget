name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check dependency baseline
        run: ./dependency-update.sh --check

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Rust verification components
        run: rustup component add rustfmt clippy
      - name: Check project style
        run: ./style-check.sh
      - name: Check formatting
        id: formatting
        continue-on-error: true
        run: cargo fmt --all -- --check
      - name: Run infrastructure CI orchestration
        run: ./ci-check.sh
      - name: Run build verification
        run: ./.infra/tools/infra-tool.sh rs-infra-verify --project "$GITHUB_WORKSPACE" run --suite build
      - name: Run test verification
        run: ./.infra/tools/infra-tool.sh rs-infra-verify --project "$GITHUB_WORKSPACE" run --suite test
      - name: Run documentation verification
        run: ./.infra/tools/infra-tool.sh rs-infra-verify --project "$GITHUB_WORKSPACE" run --suite doc
      - name: Run package verification
        run: ./.infra/tools/infra-tool.sh rs-infra-verify --project "$GITHUB_WORKSPACE" run --suite package
      - name: Fail when formatting is not clean
        if: steps.formatting.outcome == 'failure'
        run: exit 1

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Collect and check coverage
        run: ./coverage.sh
